name: Windows verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CI: 'true'
      EPP_NO_PAUSE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Isolated application data
        run: |
          "EPP_DATA_DIR=$env:RUNNER_TEMP\epp-ci-data" >> $env:GITHUB_ENV
      - name: Rust components
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable
      - name: Setup
        shell: cmd
        run: setup.bat
      - name: Tests and lint
        shell: cmd
        run: test.bat
      - name: Production executable
        shell: cmd
        run: build.bat
      - name: Installer
        shell: cmd
        run: package.bat
      - name: Packaged MCP
        run: node scripts/mcp-smoke.mjs
      - name: Installer lifecycle
        shell: powershell
        run: |
          $installer = Get-ChildItem -LiteralPath target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          & ./scripts/installer-smoke.ps1 -installerPath $installer.FullName
