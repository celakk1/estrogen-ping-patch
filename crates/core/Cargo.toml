[package]
name = "epp-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rusqlite = { version = "0.38", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
sha2 = "0.10"
hickory-proto = { version = "=0.26.3", default-features = false, features = ["std"] }
getrandom = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_IO", "Win32_System_LibraryLoader"] }

[[bin]]
name = "epp-check"
path = "src/bin/check.rs"
