[package]
name = "epp-service"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "sync", "macros"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_EventLog"] }

[[bin]]
name = "epp-network-service"
path = "src/main.rs"
