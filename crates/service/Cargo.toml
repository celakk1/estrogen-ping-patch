[package]
name = "epp-service"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
automatic-trials = ["dep:epp-core", "epp-core/isolated-tls"]
native-mtu-lab = ["automatic-trials", "windows-sys/Win32_System_RemoteDesktop"]
native-recovery = ["windows-sys/Win32_System_RemoteDesktop"]

[dependencies]
epp-core = { path = "../core", optional = true }
serde.workspace = true
serde_json.workspace = true
rusqlite = { version = "0.38", features = ["bundled"] }
sha2 = "0.10"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Com", "Win32_System_Ole", "Win32_System_Rpc", "Win32_System_Variant", "Win32_System_Wmi"] }
windows-service = "0.8.1"
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "sync", "macros"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_System_Memory", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_EventLog", "Win32_System_Com", "Win32_UI_Shell", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Devices_DeviceAndDriverInstallation", "Win32_System_Registry", "Win32_System_SystemInformation", "Wdk_System_SystemServices"] }

[[bin]]
name = "epp-network-service"
path = "src/main.rs"
